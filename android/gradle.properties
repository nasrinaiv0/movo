# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Let R8 shrink Android resources and code together in release builds.
android.r8.optimizedResourceShrinking=true

# --- Android Gradle Plugin 9.5 (2026-11-23) ---
# Capacitor 8 and its plugin modules (node_modules/@capacitor/*, @capgo/native-purchases and the generated
# capacitor-cordova-android-plugins module) still use the pre-AGP-9 DSL (lintOptions) and the separate Kotlin
# plugin. These AGP-provided compatibility switches keep those third-party modules building until Capacitor ships
# AGP 9 builds; remove them then (AGP 10 drops android.newDsl=false).
android.newDsl=false
android.builtInKotlin=false
# Capacitor's bridge and the bundled Cordova framework create plugin classes by reflection. AGP 9's strict full-mode
# keep semantics no longer keep default constructors for "-keep class X" rules from third-party consumer files, so
# keep AGP 8.13 keep-rule semantics for release safety. Everything else uses AGP 9 / R8 defaults, including
# optimized resource shrinking and the ban on global options (e.g. -dontoptimize) in library consumer rules.
android.r8.strictFullModeForKeepRules=false
