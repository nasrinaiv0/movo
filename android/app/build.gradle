apply plugin: 'com.android.application'

android {
    namespace = "com.nasrinai.movo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nasrinai.movo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play Console rejects duplicate or lower versionCode uploads.
        // The protected release workflow requires an explicit monotonically
        // increasing code; local unsigned builds retain the baseline 1.
        def requestedVersionCode = System.getenv("MOVO_ANDROID_VERSION_CODE")
        def releaseVersionCode = requestedVersionCode ? Integer.parseInt(requestedVersionCode) : 1
        if (releaseVersionCode < 1 || releaseVersionCode > 2100000000) {
            throw new GradleException("MOVO_ANDROID_VERSION_CODE is outside Google Play limits")
        }
        versionCode releaseVersionCode
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is only configured on protected CI runners with all four
    // credentials present. Never embed keystore bytes or passwords in source.
    def signingPath = System.getenv("ANDROID_KEYSTORE_PATH")
    def signingAlias = System.getenv("ANDROID_KEY_ALIAS")
    def storePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
    signingConfigs {
        if (signingPath && signingAlias && storePasswordValue && keyPasswordValue) {
            release {
                storeFile file(signingPath)
                storePassword storePasswordValue
                keyAlias signingAlias
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            // An unsigned release can still compile in ordinary CI; the signed
            // Play bundle workflow separately requires the signing secrets.
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Rate MOVO: Google Play In-App Review (src/lib/reviewPrompt.js, MovoNativePlugin.requestReview).
    implementation "com.google.android.play:review:2.0.2"
    // Referral download links: reads the Google Play install referrer once (MovoNativePlugin.installReferrer).
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
