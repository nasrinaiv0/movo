name: MOVO Finance Tenant Isolation (local PostgreSQL)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: movo-finance-tenant-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finance-authorization:
    name: Isolated two-user financial RPC regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: movo-isolated-ci-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout untrusted PR without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Use the client utilities already shipped in the disposable postgres:18
      # service image. The runner's Ubuntu apt mirror is not a release gate.
      - name: Use PostgreSQL clients inside the isolated service
        env:
          MOVO_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: movo-isolated-ci-only
        run: |
          set -euo pipefail
          test -n "${MOVO_TEST_PG_CONTAINER:?Postgres service is missing}"
          client_dir="${RUNNER_TEMP}/movo-pg-client"
          mkdir -p "$client_dir"
          for client in psql createdb dropdb; do
            cat > "$client_dir/$client" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i -e "PGPASSWORD=${PGPASSWORD:?}" "${MOVO_TEST_PG_CONTAINER:?}" "$(basename "$0")" "$@"
          SH
            chmod 0700 "$client_dir/$client"
          done
          "$client_dir/psql" -h 127.0.0.1 -p 5432 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' | grep -qx '1'
          printf '%s\n' "$client_dir" >> "$GITHUB_PATH"
      - name: Run migrations and cross-account authorization against disposable localhost DB
        env:
          MOVO_TEST_PGHOST: 127.0.0.1
          MOVO_TEST_PGPORT: "5432"
          MOVO_TEST_PGUSER: postgres
          MOVO_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: movo-isolated-ci-only
        run: python3 scripts/test-finance-rpc-isolation-local.py
