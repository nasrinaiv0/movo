name: MOVO Finance Tenant Isolation (local PostgreSQL)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: movo-finance-tenant-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finance-authorization:
    name: Isolated two-user financial RPC regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: movo-isolated-ci-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout untrusted PR without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use PostgreSQL client from the disposable service container
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps -q --filter ancestor=postgres:18 | head -n 1)"
          if [ -z "$container" ]; then
            echo "Disposable PostgreSQL service container is unavailable" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/movo-pg-bin"
          for tool in psql createdb dropdb; do
            cat > "$RUNNER_TEMP/movo-pg-bin/$tool" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="${0##*/}"
          exec docker exec -i -e PGPASSWORD "$MOVO_TEST_PG_CONTAINER" "$tool" "$@"
          SH
            chmod 700 "$RUNNER_TEMP/movo-pg-bin/$tool"
          done
          echo "$RUNNER_TEMP/movo-pg-bin" >> "$GITHUB_PATH"
          echo "MOVO_TEST_PG_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Run migrations and cross-account authorization against disposable localhost DB
        env:
          MOVO_TEST_PGHOST: 127.0.0.1
          MOVO_TEST_PGPORT: "5432"
          MOVO_TEST_PGUSER: postgres
          PGPASSWORD: movo-isolated-ci-only
        run: python3 scripts/test-finance-rpc-isolation-local.py
