name: Hybrid sync security and accounting
on:
  pull_request:
    paths:
      - 'src/lib/hybrid*'
      - 'src/lib/indexedBalance*'
      - 'src/lib/offlineWorkspaceStore*'
      - 'src/components/AuthPanel*'
      - 'src/App.*'
      - 'src/AppOfflineFirst.test.js'
      - 'src/i18n/catalog/hybrid-sync.js'
      - 'package*.json'
      - '.github/workflows/hybrid-sync-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npx --yes npm@11.19.1 ci --ignore-scripts --no-audit
      - run: npm run i18n
      - run: npm run typecheck
      - run: CI=true npm test -- --runInBand --silent
