name: MOVO Phase 1 CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: movo-phase1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Automated verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Confirm Node.js 26 runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) !== 26) process.exit(1)"
      - name: Verify documentation accompanies each implementation commit
        env:
          MOVO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/require-pr-documentation.cjs
      - name: Install locked dependencies (pinned npm 11)
        run: npx --yes npm@11.19.1 ci
      - name: Validate Android public auth configuration contract
        run: node --test scripts/validate-android-auth-config.test.cjs
      - name: Audit production dependencies
        run: npm run audit:production
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Translation catalogue coverage
        run: npm test -- --runInBand src/lib/i18n.test.js
      - name: Full regression suite
        run: npm test -- --runInBand
      - name: Production build
        run: CI=true npx react-scripts build
