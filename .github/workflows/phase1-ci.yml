name: MOVO Phase 1 CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: movo-phase1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Automated verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (repository does not commit a lockfile)
        run: npm install
      - name: Audit production dependencies
        run: npm run audit:production
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Translation catalogue coverage
        run: npm test -- --runInBand src/lib/i18n.test.js
      - name: Full regression suite
        run: npm test -- --runInBand
      - name: Production build
        run: CI=true npx react-scripts build
