name: MOVO loan form visual acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/screens/FinancialPlanning.js'
      - 'src/lib/obligationsRepository.js'
      - 'scripts/ui-qa/**'
      - '.github/workflows/loan-form-visual.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: movo-loan-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  render:
    name: render${{ matrix.variant == 'svg-candidate' && ' (svg-candidate)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 347 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["baseline","svg-candidate"]') || fromJSON('["baseline"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ matrix.variant == 'svg-candidate' && github.event.pull_request.head.sha || github.sha }}
      - name: Prepare isolated exact SVG candidate
        if: matrix.variant == 'svg-candidate'
        uses: ./.github/actions/svg-candidate-acceptance
        with:
          head: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install locked application dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Install isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/movo-ui-tools" --no-save --ignore-scripts playwright@1.65.1
          "$RUNNER_TEMP/movo-ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build and render actual loan form with synthetic records only
        run: |
          npm run i18n
          MOVO_UI_QA_ENTRY=loan NODE_ENV=development node scripts/ui-qa/build.cjs
          find /tmp/movo-ui-qa -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          NODE_PATH="$RUNNER_TEMP/movo-ui-tools/node_modules" QA_OUTPUT="$RUNNER_TEMP/movo-loan-ui" node scripts/ui-qa/loan-form.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movo-loan-form-rendered${{ matrix.variant == 'svg-candidate' && '-svg-candidate' || '' }}
          path: ${{ runner.temp }}/movo-loan-ui/
          if-no-files-found: error
          retention-days: 7
      - name: Verify SVG candidate provenance after acceptance
        if: always() && !cancelled() && matrix.variant == 'svg-candidate'
        env:
          MOVO_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/security/prepare-svg-acceptance.py --verify-only --checkout "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/movo-svg-provenance.json" --head "$MOVO_EXPECTED_HEAD"
      - name: Upload candidate provenance separately
        if: always() && matrix.variant == 'svg-candidate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: movo-svg-provenance-loan
          path: ${{ runner.temp }}/movo-svg-provenance.json
          if-no-files-found: error
          retention-days: 7
