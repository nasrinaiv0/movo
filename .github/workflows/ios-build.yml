name: MOVO iOS build

# Compiles the iOS app (Capacitor + MOVO's Swift plugin) for the simulator without signing, so native changes are
# checked on every PR without a Mac. Signing, TestFlight and App Store uploads are a separate, later workflow.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # The bundled web application shares business, auth and billing code with iOS.
    # Any functional change must recompile and smoke-test the native app.
    paths:
      - "ios/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "scripts/**"
      - "capacitor.config.json"
      - "codemagic.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "scripts/**"
      - "capacitor.config.json"
      - "codemagic.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 26 (Capacitor 8 requires Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Validate iOS distribution contract
        run: |
          node --test scripts/check-ios-release-readiness.test.cjs scripts/check-app-store-rights.test.cjs
          node scripts/check-ios-release-readiness.cjs
      - name: Build the web app
        run: npm run build:app-store
      - name: Copy the web app into the iOS project
        run: npx cap sync ios
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile Apple Watch companion for watchOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -target MOVOWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 120
      - name: Verify wearable privacy and manifest contracts
        run: python3 scripts/test-wearable-contract.py
      - name: Compile for the iOS simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/movo-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 200
      - name: Compile unsigned Release for physical iOS target
        # This catches production-only Swift/Capacitor compilation defects; it is not a signed IPA.
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/movo-release-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 200
      - name: Verify simulator smoke orchestration on the host
        run: python3 scripts/test-ios-simulator-smoke.py
      - name: Boot iPhone Simulator and launch MOVO
        run: |
          set -euo pipefail
          python3 scripts/ios-simulator-smoke.py \
            --app "$RUNNER_TEMP/movo-derived-data/Build/Products/Debug-iphonesimulator/App.app" \
            --screenshot "$RUNNER_TEMP/movo-ios-smoke/iphone-simulator-smoke.png"
      - name: Assert actual MOVO native screens with XCTest
        run: |
          set -euo pipefail
          DEVICE=$(python3 -c 'import importlib.util,subprocess; s=importlib.util.spec_from_file_location("smoke","scripts/ios-simulator-smoke.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.choose_iphone(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"],text=True))["udid"])')
          mkdir -p "$RUNNER_TEMP/movo-ios-smoke"
          RESULT="$RUNNER_TEMP/movo-native-visual.xcresult"
          set +e
          xcodebuild -project ios/App/App.xcodeproj -scheme MOVOVisualAcceptance -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/movo-derived-data" -resultBundlePath "$RESULT" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/movo-ios-smoke/native-visual.log" 2>&1
          STATUS=$?
          set -e
          tail -n 120 "$RUNNER_TEMP/movo-ios-smoke/native-visual.log"
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool export attachments --path "$RESULT" --output-path "$RUNNER_TEMP/movo-ios-smoke/native-attachments"
          fi
          test "$STATUS" -eq 0
          test -n "$(find "$RUNNER_TEMP/movo-ios-smoke/native-attachments" -type f -name '*.png' -print -quit)"
      - name: Upload simulator smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movo-iphone-simulator-smoke
          path: ${{ runner.temp }}/movo-ios-smoke/
          if-no-files-found: ignore
          retention-days: 7
