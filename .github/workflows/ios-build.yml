name: MOVO iOS build

# Compiles the iOS app (Capacitor + MOVO's Swift plugin) for the simulator without signing, so native changes are
# checked on every PR without a Mac. Signing, TestFlight and App Store uploads are a separate, later workflow.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - "src/lib/nativeSecureAuthStorage.js"
      - "src/lib/nativeAutomationKey.js"
      - "src/lib/native.js"
      - "src/lib/supabaseClient.js"
      - "src/index.tsx"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - "src/lib/nativeSecureAuthStorage.js"
      - "src/lib/nativeAutomationKey.js"
      - "src/lib/native.js"
      - "src/lib/supabaseClient.js"
      - "src/index.tsx"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js (the Capacitor 8 CLI needs Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build the web app
        run: CI=true npx react-scripts build
      - name: Copy the web app into the iOS project
        run: npx cap sync ios
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile for the iOS simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 200
