name: MOVO Android native security build

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/lib/native*"
      - "src/lib/supabaseClient.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build web assets and run unit tests
        run: CI=true npm run build
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Compile debug and R8 release variants (unsigned)
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
