name: MOVO Android native security build

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/lib/native*"
      - "src/lib/supabaseClient.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-android:
    name: native-android${{ matrix.variant == 'svg-candidate' && ' (svg-candidate)' || '' }}
    # Match the qualified runner used by the paired Android R8 workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 347 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["baseline","svg-candidate"]') || fromJSON('["baseline"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.variant == 'svg-candidate' && github.event.pull_request.head.sha || github.sha }}
      - name: Prepare isolated exact SVG candidate
        if: matrix.variant == 'svg-candidate'
        uses: ./.github/actions/svg-candidate-acceptance
        with:
          head: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # ubuntu-latest already provides the Android command-line SDK. Avoid
      # setup-android@v3's obsolete 'sdkmanager tools' package installation.
      - name: Verify Android SDK and install API 36 packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build web assets and run unit tests
        run: CI=true npm run build
      - name: Check the app bundles MOVO's public cloud connection (sign-in)
        run: node scripts/check-bundled-cloud-config.cjs build
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Compile debug, isolated auth-test and R8 release variants (unsigned)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # GitHub release CDN sometimes returns 502/503/504 while Gradle fetches
          # its distribution or Kotlin dependencies. Retry transport failures only;
          # never turn a real Java/Kotlin compile error into a passing build.
          for attempt in 1 2 3; do
            log="${RUNNER_TEMP}/movo-gradle-attempt-${attempt}.log"
            if bash gradlew :app:assembleDebug :app:assembleAuthTest :app:assembleRelease :wear:assembleDebug :wear:bundleRelease --no-daemon --stacktrace 2>&1 | tee "$log"; then
              exit 0
            fi
            if (( attempt < 3 )) && grep -Eqi '(HTTP response code: (429|502|503|504)|status code (429|502|503|504)|Read timed out|Connection reset)' "$log"; then
              echo "::warning::Transient Gradle artifact download failure (attempt ${attempt}/3); retrying"
              sleep $((attempt * 15))
            else
              echo "::error::Android native build failed; see Gradle output above"
              exit 1
            fi
          done

      # The debug-only .authcheck package installs alongside a Play build.
      # No upload keystore, Google Play, service-role or production signing
      # secrets are exposed. The only bundled Supabase values are public.
      - name: Verify isolated Android auth-test APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/authTest/app-authTest.apk
          test -s "$APK"
          APKTOOL="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKTOOL"
          PACKAGE="$("$APKTOOL" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
          if [[ "$PACKAGE" != "com.nasrinai.movo.authcheck" ]]; then
            echo "::error::Auth acceptance artifact has an unsafe application ID"
            exit 1
          fi
          # The Play-compatible debug build must keep the existing OAuth URI,
          # while isolated Auth Test must register its own distinct scheme.
          "$APKTOOL" dump xmltree "$APK" AndroidManifest.xml | grep -F 'movo-authcheck' >/dev/null || {
            echo "::error::Auth Test manifest missing isolated Google return scheme"
            exit 1
          }
          "$APKTOOL" dump xmltree android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -F '"movo"' >/dev/null || {
            echo "::error::Production-compatible Android manifest missing original MOVO scheme"
            exit 1
          }
      - name: Upload isolated auth-test APK (not a Play release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: movo-android-authcheck-${{ github.event.pull_request.head.sha }}${{ matrix.variant == 'svg-candidate' && '-svg-candidate' || '' }}
          path: android/app/build/outputs/apk/authTest/app-authTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify SVG candidate provenance after acceptance
        if: always() && !cancelled() && matrix.variant == 'svg-candidate'
        env:
          MOVO_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/security/prepare-svg-acceptance.py --verify-only --checkout "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/movo-svg-provenance.json" --head "$MOVO_EXPECTED_HEAD"
      - name: Upload candidate provenance separately
        if: always() && matrix.variant == 'svg-candidate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: movo-svg-provenance-android
          path: ${{ runner.temp }}/movo-svg-provenance.json
          if-no-files-found: error
          retention-days: 7
