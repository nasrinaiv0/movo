name: MOVO Android native security build

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/lib/native*"
      - "src/lib/supabaseClient.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest already provides the Android command-line SDK. Avoid
      # setup-android@v3's obsolete 'sdkmanager tools' package installation.
      - name: Verify Android SDK and install API 36 packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build web assets and run unit tests
        run: CI=true npm run build
      - name: Check the app bundles MOVO's public cloud connection (sign-in)
        run: node scripts/check-bundled-cloud-config.cjs build
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Compile debug, isolated auth-test and R8 release variants (unsigned)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # GitHub release CDN sometimes returns 502/503/504 while Gradle fetches
          # its distribution or Kotlin dependencies. Retry transport failures only;
          # never turn a real Java/Kotlin compile error into a passing build.
          for attempt in 1 2 3; do
            log="${RUNNER_TEMP}/movo-gradle-attempt-${attempt}.log"
            if bash gradlew :app:assembleDebug :app:assembleAuthTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$log"; then
              exit 0
            fi
            if (( attempt < 3 )) && grep -Eqi '(HTTP response code: (429|502|503|504)|status code (429|502|503|504)|Read timed out|Connection reset)' "$log"; then
              echo "::warning::Transient Gradle artifact download failure (attempt ${attempt}/3); retrying"
              sleep $((attempt * 15))
            else
              echo "::error::Android native build failed; see Gradle output above"
              exit 1
            fi
          done

      # The debug-only .authcheck package installs alongside a Play build.
      # No upload keystore, Google Play, service-role or production signing
      # secrets are exposed. The only bundled Supabase values are public.
      - name: Verify isolated Android auth-test APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/authTest/app-authTest.apk
          test -s "$APK"
          APKTOOL="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKTOOL"
          PACKAGE="$("$APKTOOL" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
          if [[ "$PACKAGE" != "com.nasrinai.movo.authcheck" ]]; then
            echo "::error::Auth acceptance artifact has an unsafe application ID"
            exit 1
          fi
      - name: Upload isolated auth-test APK (not a Play release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: movo-android-authcheck-${{ github.event.pull_request.head.sha }}
          path: android/app/build/outputs/apk/authTest/app-authTest.apk
          if-no-files-found: error
          retention-days: 7
