name: MOVO Android native security build

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/lib/native*"
      - "src/lib/supabaseClient.js"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest already provides the Android command-line SDK. Avoid
      # setup-android@v3's obsolete 'sdkmanager tools' package installation.
      - name: Verify Android SDK and install API 36 packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build web assets and run unit tests
        run: CI=true npm run build
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Compile debug and R8 release variants (unsigned)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # GitHub release CDN sometimes returns 502/503/504 while Gradle fetches
          # its distribution or Kotlin dependencies. Retry transport failures only;
          # never turn a real Java/Kotlin compile error into a passing build.
          for attempt in 1 2 3; do
            log="${RUNNER_TEMP}/movo-gradle-attempt-${attempt}.log"
            if bash gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$log"; then
              exit 0
            fi
            if (( attempt < 3 )) && grep -Eqi '(HTTP response code: (429|502|503|504)|status code (429|502|503|504)|Read timed out|Connection reset)' "$log"; then
              echo "::warning::Transient Gradle artifact download failure (attempt ${attempt}/3); retrying"
              sleep $((attempt * 15))
            else
              echo "::error::Android native build failed; see Gradle output above"
              exit 1
            fi
          done
