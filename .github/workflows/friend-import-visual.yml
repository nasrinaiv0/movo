name: MOVO friend import visual acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/Friend*.js'
      - 'src/components/Friend*.css'
      - 'src/lib/sharedLedgerDate.js'
      - 'src/App.js'
      - 'scripts/ui-qa/**'
      - '.github/workflows/friend-import-visual.yml'
permissions:
  contents: read
concurrency:
  group: movo-friend-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npx --yes npm@11.19.1 ci
      - name: Install pinned isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/movo-ui-tools" --no-save --ignore-scripts playwright@1.65.1
          "$RUNNER_TEMP/movo-ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render actual conversation using synthetic loopback data
        run: |
          npm run i18n
          MOVO_UI_QA_ENTRY=friend NODE_ENV=development node scripts/ui-qa/build.cjs
          NODE_PATH="$RUNNER_TEMP/movo-ui-tools/node_modules" QA_OUTPUT="$RUNNER_TEMP/movo-friend-ui" node scripts/ui-qa/friend-import.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movo-friend-import-rendered
          path: ${{ runner.temp }}/movo-friend-ui/
          if-no-files-found: error
          retention-days: 7
