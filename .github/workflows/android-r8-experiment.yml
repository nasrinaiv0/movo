name: MOVO isolated Android R8 experiment

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/r8/**"
      - "scripts/native_evidence.py"
      - "scripts/test_native_evidence.py"
      - "scripts/test_integrated_harness.py"
      - ".github/workflows/android-r8-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movo-r8-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controlled-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      R8_OUTPUT: ${{ github.workspace }}/tmp/r8-experiment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # verified v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install SDK 36 and Python analyzer dependency
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          python3 -m venv "$RUNNER_TEMP/r8-python"
          "$RUNNER_TEMP/r8-python/bin/pip" install 'protobuf==6.33.4'
          echo "$RUNNER_TEMP/r8-python/bin" >> "$GITHUB_PATH"
      - name: Create disposable experiment signing key
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/r8-test.jks" -storepass "$password" -keypass "$password" -alias r8-test -keyalg RSA -keysize 2048 -validity 2 -dname "CN=MOVO Synthetic R8 Test"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/r8-test.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=r8-test" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install locked dependencies and build identical bundled UI
        run: |
          set -euo pipefail
          npx --yes npm@11.19.1 ci
          CI=true npm run build
          node scripts/check-bundled-cloud-config.cjs build
          npx cap sync android
          python3 -m unittest discover -s scripts/r8 -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_native_evidence.py' -v
          python3 -m unittest discover -s scripts -p 'test_integrated_harness.py' -v
      - name: Default release compiler baseline and candidate
        id: default-build
        run: python3 scripts/r8/experiment.py --mode default --output "$R8_OUTPUT"
      - name: Diagnostic R8 9.4.34 matched baseline and candidate
        run: python3 scripts/r8/experiment.py --mode analyzer --output "$R8_OUTPUT"
      - name: Verify temporary configuration restored
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          # A non-cancelled compiler failure or drift must never be repaired into a pass.
          git diff --exit-code -- android/settings.gradle android/app/proguard-rules.pro
      - name: Restore experiment-owned paths after cancellation only
        if: cancelled()
        run: |
          set -euo pipefail
          if git diff --exit-code -- android/settings.gradle android/app/proguard-rules.pro; then exit 0; fi
          # Runner cancellation can interrupt Python before its finally block.
          # Restore only the two experiment-owned paths in this disposable checkout.
          git restore --source=HEAD --worktree -- android/settings.gradle android/app/proguard-rules.pro
          git diff --exit-code -- android/settings.gradle android/app/proguard-rules.pro
          echo "::warning::Cancelled experiment configuration restored; no acceptance credit"
      - name: Release compiler daemons and record memory before emulator
        if: ${{ !cancelled() && steps.default-build.outcome == 'success' }}
        run: |
          free -m
          bash android/gradlew --stop -p android
          free -m
          df -h "$RUNNER_TEMP"
      - name: Enable KVM on disposable Linux runner
        if: ${{ !cancelled() && steps.default-build.outcome == 'success' }}
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      # Verified v2 annotated tag -> commit a421e438; Google skill is pinned in experiment.py.
      - name: Offline emulator acceptance on DEFAULT release baseline
        id: baseline-acceptance
        timeout-minutes: 25
        if: ${{ !cancelled() && steps.default-build.outcome == 'success' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: movo-r8-baseline
          force-avd-creation: true
          ram-size: 4096M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/r8/emulator_smoke.py --disposable-emulator --variant baseline --output "$R8_OUTPUT"
      # Keep both fresh AVD results even when the first fails. No failure is ignored.
      - name: Offline emulator acceptance on DEFAULT release candidate
        id: candidate-acceptance
        if: ${{ !cancelled() && steps.default-build.outcome == 'success' }}
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: movo-r8-candidate
          force-avd-creation: true
          ram-size: 4096M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/r8/emulator_smoke.py --disposable-emulator --variant candidate --output "$R8_OUTPUT"
      - name: Require both actual emulator acceptance results
        if: ${{ always() && !cancelled() && steps.default-build.outcome == 'success' }}
        env:
          BASELINE_OUTCOME: ${{ steps.baseline-acceptance.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate-acceptance.outcome }}
        run: |
          set -euo pipefail
          test "$BASELINE_OUTCOME" = success
          test "$CANDIDATE_OUTCOME" = success
          test -s "$R8_OUTPUT/default/baseline/device/passed.txt"
          test -s "$R8_OUTPUT/default/candidate/device/passed.txt"
      - name: Record runner resources after emulator failure
        if: failure() && steps.default-build.outcome == 'success'
        run: |
          free -m
          df -h "$RUNNER_TEMP"
          ps -eo pid,comm,rss --sort=-rss | sed -n '1,15p'
          sudo dmesg --ctime | tail -n 120
      - name: Collect emulator diagnostics even on failure
        if: always() && steps.default-build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: movo-r8-emulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tmp/r8-experiment/legal-fixture.json
            tmp/r8-experiment/default/*/device/
            /tmp/android-runner/
          if-no-files-found: warn
          retention-days: 7
      - name: Collect evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: movo-r8-experiment-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/r8-experiment/
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/r8-test.jks"
